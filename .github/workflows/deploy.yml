name: GitHub Deploy
run-name: Deploy new commit
on: [push]
jobs:
  deploy:
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    runs-on: ubuntu-latest
    environment: environment
    steps:
      - run: |
            mkdir -p ~/.ssh
            echo $SSH_PRIVATE_KEY > ~/.ssh/key
            cat ~/.ssh/key
            chmod 600 ~/.ssh/key
            eval "$(ssh-agent -s)"
            echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
            ssh ssh.sanh.rip ls
