name: GitHub Deploy
run-name: Deploy new commit
on: [push]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p ~/.ssh
      - run: echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
      - run: ssh ssh.sanh.rip ls
      - run: eval "$(ssh-agent -s)"
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
